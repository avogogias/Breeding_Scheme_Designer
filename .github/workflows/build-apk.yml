name: Build & Release Android APK

on:
  push:
    branches:
      - "claude/android-dev-*"
      - master
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [master]
    paths:
      - "android/**"
  workflow_dispatch:       # allow manual trigger

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── JDK ──────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # ── Gradle cache ─────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── Permissions ───────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── Build debug APK (installable without key) ────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── Build release APK (signed with debug key for easy sideloading) ───
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # ── Rename APKs to friendly names ────────────────────────────────────
      - name: Rename APKs
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/BreedingDesigner-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk \
             output/BreedingDesigner-release.apk 2>/dev/null || true

      # ── Upload as workflow artifact (downloadable from Actions tab) ───────
      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BreedingDesigner-APK
          path: output/*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only release on pushes to the android-dev branch or master
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/claude/android-dev') || github.ref == 'refs/heads/master')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: BreedingDesigner-APK
          path: output

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create/update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Breeding Designer – Latest Android Build"
          body: |
            ## 🌾 Breeding Scheme Designer – Android 13 App

            **Self-contained, offline Android app** for simulating and comparing
            plant breeding program strategies.

            ### Installation (OxygenOS 13 / Android 13)
            1. Download **BreedingDesigner-debug.apk** below.
            2. On your OnePlus phone go to **Settings → Additional Settings → Developer Options** → enable **Install unknown apps** for your browser/file manager.
               *(Or Settings → Apps → Special app access → Install unknown apps.)*
            3. Open the downloaded APK and tap **Install**.
            4. Launch **Breeding Designer** from your app drawer.

            ### Features
            - Configure genetic variances (σ²G, σ²GxL, σ²GxY)
            - Design multi-stage yield trial programs
            - Run deterministic breeding simulations
            - Visualise genetic gain with interactive box plots
            - Compare up to 5 breeding scenarios side-by-side
            - Cost analysis (gain per year, gain per dollar)
            - Fully offline – no internet required

            ---
            Build: `${{ steps.sha.outputs.short }}` · Branch: `${{ github.ref_name }}`
          files: output/*.apk
          prerelease: ${{ github.ref != 'refs/heads/master' }}
